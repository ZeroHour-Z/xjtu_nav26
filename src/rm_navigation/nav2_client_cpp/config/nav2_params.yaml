# ============ 行为树导航器配置 ============
bt_navigator:
  ros__parameters:
    use_sim_time: False  # 是否使用仿真时间
    global_frame: map  # 全局坐标系
    robot_base_frame: base_link  # 机器人底盘坐标系
    odom_topic: aft_mapped_to_init  # 里程计话题
    bt_loop_duration: 10  # 行为树循环周期(ms)
    default_server_timeout: 20  # 默认服务超时时间(s)
    enable_groot_monitoring: True  # 启用 Groot 可视化监控
    groot_zmq_publisher_port: 1666  # Groot 发布端口
    groot_zmq_server_port: 1667  # Groot 服务端口
    plugin_lib_names:
    # - find_safe_goal_bt_node
    - nav2_compute_path_to_pose_action_bt_node
    - nav2_follow_path_action_bt_node
    - nav2_clear_costmap_service_bt_node
    - nav2_wait_action_bt_node
    - nav2_is_stuck_condition_bt_node
    - nav2_rate_controller_bt_node
    - nav2_distance_controller_bt_node
    - nav2_pipeline_sequence_bt_node
    - nav2_recovery_node_bt_node
    - nav2_goal_checker_selector_bt_node
    - nav2_compute_path_through_poses_action_bt_node
    - nav2_back_up_action_bt_node
    - nav2_spin_action_bt_node
    - nav2_goal_reached_condition_bt_node
    - nav2_goal_updated_condition_bt_node
    - nav2_initial_pose_received_condition_bt_node
    - nav2_reinitialize_global_localization_service_bt_node
    - nav2_speed_controller_bt_node
    - nav2_truncate_path_action_bt_node
    - nav2_goal_updater_node_bt_node
    - nav2_round_robin_node_bt_node
    - nav2_transform_available_condition_bt_node
    - nav2_time_expired_condition_bt_node
    - nav2_distance_traveled_condition_bt_node
    - nav2_single_trigger_bt_node
    - nav2_is_battery_low_condition_bt_node
    - nav2_navigate_through_poses_action_bt_node
    - nav2_navigate_to_pose_action_bt_node
    - nav2_remove_passed_goals_action_bt_node
    - nav2_planner_selector_bt_node
    - nav2_controller_selector_bt_node

bt_navigator_rclcpp_node:
  ros__parameters:
    use_sim_time: False

# ============ 路径跟踪控制器配置 ============
controller_server:
  ros__parameters:
    use_sim_time: False
    controller_frequency: 20.0  # 控制器更新频率(Hz) - 提高到20Hz以应对快速旋转
    min_x_velocity_threshold: 0.001  # X方向最小速度阈值(m/s)
    min_y_velocity_threshold: 0.001  # Y方向最小速度阈值(m/s)
    min_theta_velocity_threshold: 0.001  # 角速度最小阈值(rad/s)
    failure_tolerance: 0.5  # 失败容忍度 - 增加以应对陀螺旋转
    progress_checker_plugin: "progress_checker"  # 进度检查插件
    goal_checker_plugins: ["general_goal_checker"]  # 目标检查插件
    controller_plugins: ["FollowPath"]  # 使用的控制器插件

    # === 进度检查器参数 ===
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.3  # 要求的移动半径(m) - 减小以适应陀螺
      movement_time_allowance: 15.0  # 允许的移动时间(s) - 增加时间容忍

    # === 目标检查器参数 ===
    general_goal_checker:
      stateful: True  # 保持状态
      plugin: "nav2_controller::SimpleGoalChecker"
      # 【关键】到达容差必须 > GVC 的停车距离(brake_stop_margin≈0.15m)，否则机器人停在
      # 0.15m 处而 nav2 等它进到容差内才判到达 → FollowPath 永不成功 → 目标永不取消。
      xy_goal_tolerance: 0.25  # XY平面位置容差(m)
      # 本架构下航向由 GVC 下发角度给电控控制，nav2 不参与 yaw 闭环，放开避免误卡完成判定
      yaw_goal_tolerance: 3.15  # 航向角容差(rad)，≈不约束

    # === Regulated Pure Pursuit 路径跟踪控制器 ===
    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      desired_linear_vel: 0.4  # 期望线速度(m/s) - 过弯时降低切角风险
      lookahead_dist: 0.4  # 前瞻距离(m) - 减小以避免急弯内切
      min_lookahead_dist: 0.2  # 最小前瞻距离(m)
      max_lookahead_dist: 0.6  # 最大前瞻距离(m)
      lookahead_time: 1.0  # 前瞻时间(s)
      regulated_linear_scaling_min_radius: 0.9  # 线速度缩放最小半径(m) - 更小允许更急转弯
      use_velocity_scaled_lookahead_dist: false  # 禁用速度缩放 - 陀螺时用固定前瞻
      min_approach_linear_velocity: 0.05  # 接近目标时最小线速度(m/s)
      approach_velocity_scaling_dist: 0.6  # 接近目标时速度缩放距离(m)
      use_collision_detection: true  # 启用碰撞检测
      max_allowed_time_to_collision_up_to_carrot: 1.0  # 允许的最大碰撞时间(s) - 提前触发减速
      use_regulated_angular_vel_scaling: false  # 启用角速度调节 - 近障碍时抑制旋转过冲
      use_cost_regulated_linear_velocity_scaling: false  # 根据代价地图调节速度
      cost_scaling_dist: 0.8  # 代价缩放距离(m)
      cost_scaling_gain: 1.5  # 代价缩放增益
      allow_reversing: false  # 禁止倒车
      use_rotate_to_heading: false  # 【关键】禁用先转向再前进模式，适应陀螺
      rotate_to_heading_min_angle: 0.785  # 旋转对齐最小角度(rad, ~45度)
      max_angular_vel: 1.0  # 最大角速度(rad/s) - 限制旋转扫碰风险
      max_robot_pose_search_dist: 10.0  # 最大机器人位姿搜索距离(m)
      use_interpolation: true  # 使用路径插值
      transform_tolerance: 0.2  # TF变换容忍度(s) - 降低时延导致的贴障

controller_server_rclcpp_node:
  ros__parameters:
    use_sim_time: False

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 20.0
      publish_frequency: 10.0
      global_frame: odom
      # global_frame: camera_init
      robot_base_frame: base_link
      use_sim_time: False
      rolling_window: true
      width: 3
      height: 3
      resolution: 0.01
      footprint: "[[0.295, 0.295], [0.295, -0.295], [-0.295, -0.295], [-0.295, 0.295]]"
      plugins: ["static_layer", "voxel3d_layer", "inflation_layer"]
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 20.0
        inflation_radius: 0.15
      voxel3d_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: True
        publish_voxel_map: False
        # Keep the voxel buffer slightly below the 2D odom plane. The obstacle
        # source origin can be reported as a tiny negative z (-0.00), and a
        # lower bound of exactly 0.0 makes VoxelLayer reject raytracing.
        origin_z: -0.20
        z_resolution: 0.05
        z_voxels: 24
        mark_threshold: 0
        observation_sources: traversability
        min_obstacle_height: 0.00
        max_obstacle_height: 2.0 
        traversability:
          topic: /traversability/obstacles
          data_type: "PointCloud2"
          sensor_frame: ""
          expected_update_rate: 0.0
          raytrace_min_range: 0.0
          raytrace_max_range: 8.0
          min_obstacle_height: 0.01
          max_obstacle_height: 0.02
          obstacle_min_range: 0.3
          obstacle_max_range: 6.0
          clearing: True
          marking: True
          observation_persistence: 0.3
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      always_send_full_costmap: True
  local_costmap_client:
    ros__parameters:
      use_sim_time: False
  local_costmap_rclcpp_node:
    ros__parameters:
      use_sim_time: False

# ============ 全局代价地图配置 ============
global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 20.0  # 降低更新频率减少抖动(Hz)
      publish_frequency: 10.0  # 降低发布频率(Hz)
      global_frame: map  # 全局坐标系
      robot_base_frame: base_link  # 机器人底盘坐标系
      use_sim_time: False
      footprint: "[[0.295, 0.295], [0.295, -0.295], [-0.295, -0.295], [-0.295, 0.295]]"  # 车体半边长 0.295m 的正方形 footprint
      resolution: 0.01  # 地图分辨率(m/pixel)
      track_unknown_space: true  # 跟踪未知空间
      plugins: ["static_layer", "click_obstacles_layer", "inflation_layer"]  # 使用的层插件
      # 动态点云只进入 local_costmap，global_costmap 保持静态地图 + 手动点击障碍
      click_obstacles_layer:
        plugin: "click_obstacles_layer::ClickObstaclesLayer"
        enabled: True
        obstacle_radius: 0.20
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      # === 膨胀层配置 ===
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 15.0  # 代价衰减因子(值越大衰减越快)
        inflation_radius: 0.42  # 0.8m 窄道中线距墙约 0.4m，用全局膨胀建立居中代价梯度
      always_send_full_costmap: True
  global_costmap_client:
    ros__parameters:
      use_sim_time: False
  global_costmap_rclcpp_node:
    ros__parameters:
      use_sim_time: False

map_server:
  ros__parameters:
    use_sim_time: False
    yaml_filename: ""

map_saver:
  ros__parameters:
    use_sim_time: False
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: True

# ============ 路径规划器配置 ============
planner_server:
  ros__parameters:
    expected_planner_frequency: 20.0  # 期望规划频率(Hz)
    use_sim_time: False
    planner_plugins: ["GridBased"]  # 使用的规划器插件
    GridBased:
      # --- 任意角度规划器：两点间无障碍直接走直线，消除沿格线的阶梯/45°折线 ---
      plugin: "nav2_theta_star_planner/ThetaStarPlanner"  # Theta* 任意角度 A*
      how_many_corners: 8          # 8 邻域视线检查，支持任意斜率直线
      w_euc_cost: 1.0              # 欧氏距离(路径长度)权重
      w_traversal_cost: 3.5        # 代价地图权重，越大越远离障碍/越居中(贴墙就调大)
      # 注: w_heuristic_cost 非参数，插件内部自动取 min(w_euc_cost, 1.0)
      allow_unknown: true          # 允许规划穿过未知区域
      use_final_approach_orientation: false  # 全向底盘，不为终点朝向强制旋转车体

      # --- 旧的 8 邻域栅格 A*（沿格线走出阶梯+45°折线），保留可回退 ---
      # plugin: "nav2_smac_planner/SmacPlanner2D"
      # tolerance: 0.01
      # allow_unknown: true
      # downsample_costmap: false
      # downsampling_factor: 2
      # cost_travel_multiplier: 5.0
      # use_final_approach_orientation: false
      # smoother:
      #   max_iterations: 200
      #   w_smooth: 0.6
      #   w_data: 0.3
      #   tolerance: 1.0e-10
      #   do_refinement: true
      #   refinement_num: 1

